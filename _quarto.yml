project:
  type: website
  output-dir: _site

website:
  title: "Ali Arbabian"
  site-url: "https://aliarbabian.com"
  description: "Personal site and technical writing by Ali Arbabian."
  draft-mode: unlinked
  navbar:
    pinned: true
    left:
      - text: "Bio"
        href: index.qmd
      - text: "Technical Writing"
        href: writing.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "Resume"
        href: assets/resume.pdf
  page-footer:
    left: "© Ali Arbabian"
    right:
      - icon: github
        href: "https://github.com/a-arbabian"
        aria-label: "GitHub"
      - icon: linkedin
        href: "https://www.linkedin.com/in/a-arbabian/"
        aria-label: "LinkedIn"
  open-graph: true
  twitter-card: true

format:
  html:
    theme:
      - cosmo
      - styles/tufte.scss
    toc: false
    toc-location: right
    code-copy: true
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="viewport" content="width=device-width, initial-scale=1">

execute:
  freeze: auto
